spring.application.name=sistema_campanhas_atacadao_farias

# Dados de conexao com o banco de dados
spring.datasource.url=jdbc:mysql://localhost:3336/atacadao_farias
spring.datasource.username=root
spring.datasource.password=1234567

# Configuracoes do JPA/Hibernate
# O 'update' cria ou atualiza as tabelas de forma automaticamente baseado no nosso codigo java
spring.jpa.hibernate.ddl-auto=update

# Mostra no console as queries SQL que o Spring está gerando
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true